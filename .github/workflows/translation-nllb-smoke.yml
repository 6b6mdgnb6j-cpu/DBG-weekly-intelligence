name: Real NLLB Translation Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WEEKLY_REPORT_TRANSLATION_ALLOW_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-translation.txt

      - name: Install translation dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements-translation.txt

      - name: Configure translation cache
        run: |
          echo "HF_HOME=$RUNNER_TEMP/huggingface" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/huggingface"

      - name: Run real NLLB fixture smoke
        run: |
          set -o pipefail
          PYTHONPATH="$GITHUB_WORKSPACE${PYTHONPATH:+:$PYTHONPATH}" \
            python3 scripts/translation_nllb_smoke.py | tee translation_nllb_smoke.log

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: translation-nllb-smoke
          path: translation_nllb_smoke.log
          if-no-files-found: error
