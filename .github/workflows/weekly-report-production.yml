name: DBG Weekly Report - Production

on:
  schedule:
    # Monday 08:00 Asia/Shanghai / Monday 00:00 UTC.
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      week_start:
        description: Optional target week Monday in YYYY-MM-DD format. Leave empty for previous natural week.
        required: false
        type: string
      generation_mode:
        description: Generation mode. Snapshot replay is manual-only and never falls back to live collection.
        required: false
        default: live
        type: choice
        options: [live, snapshot]
      snapshot_artifact_id:
        description: Required artifact ID for snapshot mode.
        required: false
        type: string
      snapshot_artifact_name:
        description: Required artifact name for snapshot mode.
        required: false
        type: string
      snapshot_sha256:
        description: Required SHA-256 of the original snapshot ZIP.
        required: false
        type: string
      collection_run_id:
        description: Original collection run ID for snapshot provenance.
        required: false
        type: string
      collection_sha:
        description: Original collection commit SHA for snapshot provenance.
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-report-production
  cancel-in-progress: false

jobs:
  generate:
    name: Generate bilingual weekly review bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      WEEKLY_REPORT_TRANSLATION_ALLOW_DOWNLOAD: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-crawler.txt
            requirements-translation.txt

      - name: Install crawler and translation dependencies
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install -r requirements-crawler.txt
          python3 -m pip install -r requirements-translation.txt

      - name: Prepare manual week input
        id: requested_week
        env:
          RAW_WEEK_START: ${{ github.event_name == 'workflow_dispatch' && inputs.week_start || '' }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from datetime import datetime, timedelta

          raw = os.environ.get("RAW_WEEK_START", "").strip()
          if raw:
              if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", raw):
                  raise SystemExit("week_start must use YYYY-MM-DD format")
              try:
                  start = datetime.strptime(raw, "%Y-%m-%d").date()
              except ValueError as exc:
                  raise SystemExit(f"week_start is not a valid date: {exc}") from exc
              if start.weekday() != 0:
                  raise SystemExit("week_start must be Monday")
              end = start + timedelta(days=6)
              compact = start.strftime("%Y%m%d")
              output_dir = f"output/production/{compact}"
          else:
              from crawler.date_utils import parse_week_start
              start, end = parse_week_start()
              compact = start.strftime("%Y%m%d")
              output_dir = "output"
          output_path = os.environ["GITHUB_OUTPUT"]
          with open(output_path, "a", encoding="utf-8") as f:
              f.write(f"week_start={start.isoformat() if start else ''}\n")
              f.write(f"week_end={end.isoformat() if end else ''}\n")
              f.write(f"compact_week_start={compact}\n")
              f.write(f"output_dir={output_dir}\n")
          if raw:
              print(f"Manual week requested: {start.isoformat()} to {end.isoformat()}")
          else:
              print(f"No manual week requested; resolved previous natural week: {start} to {end}.")
          PY

      - name: Run permanent tests
        id: tests
        run: |
          set +e
          python3 -m unittest discover tests
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compile Python files
        id: compile
        if: steps.tests.outcome == 'success' && steps.tests.outputs.exit_code == '0'
        run: |
          set +e
          python3 -m compileall crawler tests ./*.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Configure translation cache
        if: inputs.generation_mode != 'snapshot' && steps.tests.outcome == 'success' && steps.tests.outputs.exit_code == '0' && steps.compile.outcome == 'success' && steps.compile.outputs.exit_code == '0'
        run: |
          echo "HF_HOME=$RUNNER_TEMP/huggingface" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/huggingface"

      - name: Translation preflight
        id: translation_preflight
        if: inputs.generation_mode != 'snapshot' && steps.tests.outcome == 'success' && steps.tests.outputs.exit_code == '0' && steps.compile.outcome == 'success' && steps.compile.outputs.exit_code == '0'
        run: |
          set +e
          python3 automation_pipeline.py translation-preflight --attempts 3 --sleep-seconds 5
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Download immutable collection snapshot
        id: snapshot_download
        if: inputs.generation_mode == 'snapshot' && steps.tests.outputs.exit_code == '0' && steps.compile.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ inputs.snapshot_artifact_id }}
          ARTIFACT_NAME: ${{ inputs.snapshot_artifact_name }}
          COLLECTION_RUN_ID: ${{ inputs.collection_run_id }}
          COLLECTION_SHA: ${{ inputs.collection_sha }}
        run: |
          test -n "$ARTIFACT_ID"
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID" > collection-artifact.json
          python3 - <<'PY'
          import json
          import os

          artifact = json.load(open("collection-artifact.json", encoding="utf-8"))
          source_run = artifact.get("workflow_run") or {}
          expected = {
              "name": os.environ["ARTIFACT_NAME"],
              "run_id": int(os.environ["COLLECTION_RUN_ID"]),
              "head_sha": os.environ["COLLECTION_SHA"],
          }
          actual = {
              "name": artifact.get("name"),
              "run_id": source_run.get("id"),
              "head_sha": source_run.get("head_sha"),
          }
          if artifact.get("expired"):
              raise SystemExit("snapshot artifact has expired")
          if actual != expected:
              raise SystemExit(f"snapshot artifact provenance mismatch: expected={expected}, actual={actual}")
          PY
          gh api "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > collection-snapshot.zip

      - name: Generate bilingual weekly report and QA
        id: weekly
        if: (inputs.generation_mode == 'snapshot' && steps.tests.outputs.exit_code == '0' && steps.compile.outputs.exit_code == '0') || (inputs.generation_mode != 'snapshot' && steps.translation_preflight.outcome == 'success' && steps.translation_preflight.outputs.exit_code == '0')
        env:
          EVENT_NAME: ${{ github.event_name }}
          GENERATION_MODE: ${{ inputs.generation_mode || 'live' }}
          MANUAL_WEEK_START: ${{ steps.requested_week.outputs.week_start }}
          MANUAL_OUTPUT_DIR: ${{ steps.requested_week.outputs.output_dir }}
        run: |
          set +e
          if [ "$GENERATION_MODE" = "snapshot" ]; then
            python3 snapshot_replay.py \
              --snapshot-zip collection-snapshot.zip \
              --snapshot-sha256 "${{ inputs.snapshot_sha256 }}" \
              --week-start "$MANUAL_WEEK_START" \
              --output-dir "$MANUAL_OUTPUT_DIR" \
              --approved-file "manual_translations/approved/weekly_${{ steps.requested_week.outputs.compact_week_start }}.json" \
              --collection-run-id "${{ inputs.collection_run_id }}" \
              --collection-sha "${{ inputs.collection_sha }}" \
              --collection-artifact-id "${{ inputs.snapshot_artifact_id }}" \
              --collection-artifact-name "${{ inputs.snapshot_artifact_name }}" \
              --generation-run-id "${{ github.run_id }}" \
              --generation-sha "${{ github.sha }}"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$MANUAL_WEEK_START" ]; then
            python3 run_weekly.py --start "$MANUAL_WEEK_START" --output-dir "$MANUAL_OUTPUT_DIR" --require-translation
          else
            python3 run_weekly.py --require-translation --start "$MANUAL_WEEK_START" --output-dir "$MANUAL_OUTPUT_DIR"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = "0" ]; then
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          search_roots = []
          manual_dir = os.environ.get("MANUAL_OUTPUT_DIR", "").strip()
          if manual_dir:
              search_roots.append(Path(manual_dir))
          search_roots.append(Path("output"))

          weekly_files = []
          for root in search_roots:
              if root.exists():
                  weekly_files.extend(root.glob("weekly_data_*.json"))
          if not weekly_files:
              raise SystemExit("No weekly_data artifact found after generation")

          weekly_path = max(weekly_files, key=lambda path: path.stat().st_mtime)
          payload = json.loads(weekly_path.read_text(encoding="utf-8"))
          week_start = str(payload["week_start"])
          week_end = str(payload["week_end"])
          compact = week_start.replace("-", "")
          output_dir = str(weekly_path.parent)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"week_start={week_start}\n")
              f.write(f"week_end={week_end}\n")
              f.write(f"compact_week_start={compact}\n")
              f.write(f"output_dir={output_dir}\n")
          print(f"Generated week: {week_start} to {week_end}")
          print(f"Output directory: {output_dir}")
          PY
          fi
          exit 0

      - name: Validate bilingual artifacts before manifest
        id: bilingual_validation
        if: steps.weekly.outcome == 'success' && steps.weekly.outputs.exit_code == '0'
        run: |
          set +e
          python3 automation_pipeline.py validate-bilingual \
            --output-dir "${{ steps.weekly.outputs.output_dir }}" \
            --week-start "${{ steps.weekly.outputs.week_start }}"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create review manifest
        id: manifest
        if: steps.bilingual_validation.outcome == 'success' && steps.bilingual_validation.outputs.exit_code == '0'
        run: |
          set +e
          if [ "${{ inputs.generation_mode || 'live' }}" = "snapshot" ]; then
            test -f "${{ steps.weekly.outputs.output_dir }}/review_manifest_${{ steps.weekly.outputs.compact_week_start }}.json"
          else
            python3 automation_pipeline.py manifest \
              --output-dir "${{ steps.weekly.outputs.output_dir }}" \
              --week-start "${{ steps.weekly.outputs.week_start }}" \
              --generation-sha "${{ github.sha }}" \
              --generation-run-id "${{ github.run_id }}"
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate bilingual review bundle
        id: bundle_validation
        if: steps.manifest.outcome == 'success' && steps.manifest.outputs.exit_code == '0'
        run: |
          set +e
          python3 automation_pipeline.py validate-bundle \
            --bundle-dir "${{ steps.weekly.outputs.output_dir }}" \
            --week-start "${{ steps.weekly.outputs.week_start }}" \
            --source-run-id "${{ github.run_id }}" \
            --generation-sha "${{ github.sha }}" \
            --current-main-sha "${{ github.sha }}" \
            --approve-warning
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check published directory unchanged
        id: published_safety
        if: always()
        run: |
          set +e
          git diff --exit-code -- published/
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "SAFETY VIOLATION: Production generation must not modify published/"
          fi
          exit 0

      - name: Upload review artifacts
        id: upload_review
        if: steps.bundle_validation.outcome == 'success' && steps.bundle_validation.outputs.exit_code == '0'
        uses: actions/upload-artifact@v7
        with:
          name: weekly-report-review-${{ steps.weekly.outputs.week_start }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ steps.weekly.outputs.output_dir }}/weekly_data_${{ steps.weekly.outputs.compact_week_start }}.json
            ${{ steps.weekly.outputs.output_dir }}/source_status_${{ steps.weekly.outputs.compact_week_start }}.json
            ${{ steps.weekly.outputs.output_dir }}/weekly_report_${{ steps.weekly.outputs.compact_week_start }}.html
            ${{ steps.weekly.outputs.output_dir }}/qa_report_${{ steps.weekly.outputs.compact_week_start }}.json
            ${{ steps.weekly.outputs.output_dir }}/qa_report_${{ steps.weekly.outputs.compact_week_start }}.md
            ${{ steps.weekly.outputs.output_dir }}/review_manifest_${{ steps.weekly.outputs.compact_week_start }}.json

      - name: Upload manual translation queue
        id: upload_manual_translation_queue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: manual-translation-queue-${{ steps.requested_week.outputs.week_start }}
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ steps.requested_week.outputs.output_dir }}/manual_translation_queue_${{ steps.requested_week.outputs.compact_week_start }}.xlsx

      - name: Upload debug artifacts
        id: upload_debug
        if: always() && (steps.tests.outputs.exit_code != '0' || steps.compile.outputs.exit_code != '0' || (inputs.generation_mode != 'snapshot' && steps.translation_preflight.outputs.exit_code != '0') || (inputs.generation_mode == 'snapshot' && steps.snapshot_download.outcome != 'success') || steps.weekly.outputs.exit_code != '0' || steps.bilingual_validation.outputs.exit_code != '0' || steps.manifest.outputs.exit_code != '0' || steps.bundle_validation.outputs.exit_code != '0' || steps.published_safety.outputs.exit_code != '0')
        uses: actions/upload-artifact@v7
        with:
          name: weekly-report-debug-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            raw/**
            logs/**
            output/production/**
            output/weekly_data_*.json
            output/source_status_*.json
            output/relevance_rejected_*.json
            output/qa_report_*.json
            output/qa_report_*.md
            output/weekly_report_*.html

      - name: Write job summary
        if: always()
        env:
          WEEK_START: ${{ steps.weekly.outputs.week_start || steps.requested_week.outputs.week_start || 'unavailable' }}
          WEEK_END: ${{ steps.weekly.outputs.week_end || steps.requested_week.outputs.week_end || 'unavailable' }}
          COMPACT_WEEK_START: ${{ steps.weekly.outputs.compact_week_start || steps.requested_week.outputs.compact_week_start }}
          PROD_OUTPUT_DIR: ${{ steps.weekly.outputs.output_dir || steps.requested_week.outputs.output_dir || 'output' }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          COMPILE_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
          PREFLIGHT_EXIT_CODE: ${{ steps.translation_preflight.outputs.exit_code }}
          WEEKLY_EXIT_CODE: ${{ steps.weekly.outputs.exit_code }}
          BILINGUAL_VALIDATION_EXIT_CODE: ${{ steps.bilingual_validation.outputs.exit_code }}
          MANIFEST_EXIT_CODE: ${{ steps.manifest.outputs.exit_code }}
          BUNDLE_VALIDATION_EXIT_CODE: ${{ steps.bundle_validation.outputs.exit_code }}
          PUBLISHED_SAFETY_EXIT_CODE: ${{ steps.published_safety.outputs.exit_code }}
          BILINGUAL_VALIDATION_OUTCOME: ${{ steps.bilingual_validation.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          BUNDLE_VALIDATION_OUTCOME: ${{ steps.bundle_validation.outcome }}
          REVIEW_UPLOADED: ${{ steps.upload_review.outcome == 'success' }}
          DEBUG_UPLOAD_OUTCOME: ${{ steps.upload_debug.outcome }}
          GENERATION_RUN_ATTEMPT: ${{ github.run_attempt }}
          GENERATION_RUN_ID: ${{ github.run_id }}
          GENERATION_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def value(name, default="unavailable"):
              return os.environ.get(name) or default

          week_start = value("WEEK_START")
          week_end = value("WEEK_END")
          compact = value("COMPACT_WEEK_START", "")
          output_dir = Path(value("PROD_OUTPUT_DIR", "output"))
          qa_path = output_dir / f"qa_report_{compact}.json"
          weekly_path = output_dir / f"weekly_data_{compact}.json"
          manifest_path = output_dir / f"review_manifest_{compact}.json"
          qa = json.loads(qa_path.read_text(encoding="utf-8")) if qa_path.exists() else {}
          weekly = json.loads(weekly_path.read_text(encoding="utf-8")) if weekly_path.exists() else {}
          from automation_pipeline import review_artifact_ready, summary_highlight_count, workflow_step_status

          tests_code = value("TEST_EXIT_CODE")
          compile_code = value("COMPILE_EXIT_CODE")
          preflight_code = value("PREFLIGHT_EXIT_CODE")
          weekly_code = value("WEEKLY_EXIT_CODE")
          bilingual_code = value("BILINGUAL_VALIDATION_EXIT_CODE")
          manifest_code = value("MANIFEST_EXIT_CODE")
          validation_code = value("BUNDLE_VALIDATION_EXIT_CODE")
          safety_code = value("PUBLISHED_SAFETY_EXIT_CODE")
          review_ready = review_artifact_ready(value("REVIEW_UPLOADED"), bilingual_code, manifest_code, validation_code)
          generation = "SUCCESS" if weekly_code == "0" and review_ready else "FAILED"
          qa_status = qa.get("status", "unavailable")
          warnings = sum(1 for check in qa.get("checks", []) if check.get("result") == "WARNING") if qa else "unavailable"
          known_gaps = len(qa.get("known_gaps", [])) if qa else "unavailable"
          validation = workflow_step_status(value("BILINGUAL_VALIDATION_OUTCOME"), bilingual_code)
          manifest_status = workflow_step_status(value("MANIFEST_OUTCOME"), manifest_code)
          bundle_status = workflow_step_status(value("BUNDLE_VALIDATION_OUTCOME"), validation_code)
          review_artifact = f"weekly-report-review-{week_start}" if review_ready else "NOT READY"
          debug_artifact = (
              f"weekly-report-debug-{value('GENERATION_RUN_ID')}-{value('GENERATION_RUN_ATTEMPT')}"
              if value("DEBUG_UPLOAD_OUTCOME") == "success" else "not uploaded"
          )
          highlight_count = summary_highlight_count(weekly, qa)

          lines = [
              "# DBG Weekly Report - Production",
              "",
              f"- Week: {week_start} -> {week_end}",
              f"- Compact week start: {compact}",
              f"- Output directory: {output_dir}",
              f"- Generation status: {generation}",
              f"- Translation mode: {weekly.get('translation_mode', 'unavailable')}",
              f"- QA status: {qa_status}",
              f"- Final items: {weekly.get('item_count', 'unavailable')}",
              f"- Highlights: {highlight_count}",
              f"- Warnings: {warnings}",
              f"- Known gaps: {known_gaps}",
              f"- Bilingual validation: {validation}",
              f"- Manifest: {manifest_status}",
              f"- Bundle integrity validation: {bundle_status}",
              f"- Review artifact: {review_artifact}",
              f"- Debug artifact: {debug_artifact}",
              f"- Generation run ID: {value('GENERATION_RUN_ID')}",
              f"- Generation commit SHA: {value('GENERATION_SHA')}",
              "- Publish: NOT PERFORMED",
              "",
              f"source_run_id = {value('GENERATION_RUN_ID')}",
              f"week_start = {week_start}",
              "",
              "## Exit Codes",
              "",
              f"- Tests: {tests_code}",
              f"- Compile: {compile_code}",
              f"- Translation preflight: {preflight_code}",
              f"- Weekly generation / QA: {weekly_code}",
              f"- Bilingual validation: {bilingual_code}",
              f"- Manifest: {manifest_code}",
              f"- Bundle integrity validation: {validation_code}",
              f"- Published safety: {safety_code}",
          ]
          if qa_status == "WARNING":
              lines.extend(["", "QA WARNING: Manual review required."])
          if qa_status == "FAIL":
              lines.extend(["", "QA FAIL: Publish prohibited."])
          elif qa_status == "PASS":
              lines.extend(["", "QA PASS: Ready for manual publish review."])
          if manifest_path.exists():
              lines.extend(["", f"Manifest: {manifest_path}"])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(str(line) for line in lines) + "\n")
          print("\n".join(str(line) for line in lines))
          PY

      - name: Enforce workflow result
        if: always()
        env:
          GENERATION_MODE: ${{ inputs.generation_mode || 'live' }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          COMPILE_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
          PREFLIGHT_EXIT_CODE: ${{ steps.translation_preflight.outputs.exit_code }}
          SNAPSHOT_DOWNLOAD_OUTCOME: ${{ steps.snapshot_download.outcome }}
          WEEKLY_EXIT_CODE: ${{ steps.weekly.outputs.exit_code }}
          BILINGUAL_VALIDATION_EXIT_CODE: ${{ steps.bilingual_validation.outputs.exit_code }}
          MANIFEST_EXIT_CODE: ${{ steps.manifest.outputs.exit_code }}
          BUNDLE_VALIDATION_EXIT_CODE: ${{ steps.bundle_validation.outputs.exit_code }}
          PUBLISHED_SAFETY_EXIT_CODE: ${{ steps.published_safety.outputs.exit_code }}
        run: |
          if [ "${TEST_EXIT_CODE:-1}" != "0" ]; then
            echo "PRE-RUN TESTS FAILED"
            exit "${TEST_EXIT_CODE:-1}"
          fi
          if [ "${COMPILE_EXIT_CODE:-1}" != "0" ]; then
            echo "COMPILE FAILED"
            exit "${COMPILE_EXIT_CODE:-1}"
          fi
          if [ "$GENERATION_MODE" = "snapshot" ]; then
            if [ "$SNAPSHOT_DOWNLOAD_OUTCOME" != "success" ]; then
              echo "SNAPSHOT DOWNLOAD OR PROVENANCE VERIFICATION FAILED"
              exit 1
            fi
          elif [ "${PREFLIGHT_EXIT_CODE:-1}" != "0" ]; then
            echo "TRANSLATION PREFLIGHT FAILED"
            exit "${PREFLIGHT_EXIT_CODE:-1}"
          fi
          if [ "${PUBLISHED_SAFETY_EXIT_CODE:-1}" != "0" ]; then
            echo "SAFETY VIOLATION: Production generation must not modify published/"
            exit "${PUBLISHED_SAFETY_EXIT_CODE:-1}"
          fi
          if [ "${WEEKLY_EXIT_CODE:-1}" != "0" ]; then
            echo "WEEKLY GENERATION OR QA FAILED"
            exit "${WEEKLY_EXIT_CODE:-1}"
          fi
          if [ "${BILINGUAL_VALIDATION_EXIT_CODE:-1}" != "0" ]; then
            echo "BILINGUAL ARTIFACT VALIDATION FAILED"
            exit "${BILINGUAL_VALIDATION_EXIT_CODE:-1}"
          fi
          if [ "${MANIFEST_EXIT_CODE:-1}" != "0" ]; then
            echo "REVIEW MANIFEST FAILED"
            exit "${MANIFEST_EXIT_CODE:-1}"
          fi
          if [ "${BUNDLE_VALIDATION_EXIT_CODE:-1}" != "0" ]; then
            echo "BILINGUAL BUNDLE VALIDATION FAILED"
            exit "${BUNDLE_VALIDATION_EXIT_CODE:-1}"
          fi
          echo "Production generation completed. PUBLISH NOT PERFORMED."
